<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Simulado</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --bubble-user: #005c4b;
        --bubble-agent: #202c33;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #25d366;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #111827);
        color: var(--text);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .phone {
        width: min(420px, 92vw);
        height: 760px;
        background: #0b141a;
        border-radius: 28px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.08);
      }

      .header {
        background: #202c33;
        padding: 18px 20px;
        display: flex;
        align-items: center;
        gap: 14px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }

      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--accent);
        display: grid;
        place-items: center;
        font-weight: bold;
        color: #062714;
      }

      .header h2 {
        margin: 0;
        font-size: 1.08rem;
      }

      .header span {
        display: block;
        color: var(--muted);
        font-size: 0.72rem;
      }

      .chat {
        height: 610px;
        overflow-y: auto;
        background: #0d191f;
        padding: 18px 12px;
      }

      .message {
        max-width: 72%;
        padding: 12px 14px;
        border-radius: 12px;
        margin: 10px 0;
        line-height: 1.45;
        font-size: 0.95rem;
        white-space: pre-wrap;
      }

      .message.user {
        margin-left: auto;
        background: var(--bubble-user);
        border-bottom-right-radius: 4px;
      }

      .message.agent {
        background: var(--bubble-agent);
        border-bottom-left-radius: 4px;
      }

      .composer {
        display: flex;
        gap: 10px;
        padding: 14px 12px;
        background: #111b22;
        border-top: 1px solid rgba(255,255,255,0.06);
      }

      .composer input {
        flex: 1;
        border: none;
        border-radius: 999px;
        padding: 14px 18px;
        background: #202c33;
        color: var(--text);
        font-size: 0.95rem;
      }

      .composer button {
        border: none;
        border-radius: 999px;
        background: var(--accent);
        color: #062714;
        font-weight: bold;
        padding: 0 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <div class="header">
        <div class="avatar">WA</div>
        <div>
          <h2>Agente de correo</h2>
          <span>online</span>
        </div>
      </div>

      <div id="chat" class="chat"></div>

      <div class="composer">
        <input id="messageInput" type="text" placeholder="Escribe un mensaje" />
        <button id="sendButton">Enviar</button>
      </div>
    </div>

    <script>
      const chat = document.getElementById('chat');
      const input = document.getElementById('messageInput');
      const send = document.getElementById('sendButton');

      function renderMessages(messages) {
        chat.innerHTML = '';
        messages.forEach((msg) => {
          const el = document.createElement('div');
          el.className = `message ${msg.sender === 'Usuario' ? 'user' : 'agent'}`;
          el.textContent = `${msg.sender}: ${msg.text}`;
          chat.appendChild(el);
        });
        chat.scrollTop = chat.scrollHeight;
      }

      async function loadMessages() {
        const response = await fetch('/api/messages');
        const data = await response.json();
        renderMessages(data.messages || []);
      }

      async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;
        send.disabled = true;
        send.textContent = '...';
        try {
          const response = await fetch('/api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
          });
          input.value = '';
          await loadMessages();
          if (!response.ok) throw new Error('No se pudo enviar el mensaje.');
        } catch (error) {
          console.error(error);
        } finally {
          send.disabled = false;
          send.textContent = 'Enviar';
          input.focus();
        }
      }

      send.addEventListener('click', sendMessage);
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          sendMessage();
        }
      });

      loadMessages();
      setInterval(loadMessages, 2500);
    </script>
  </body>
</html>
